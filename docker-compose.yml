# LocalAIChat — on-demand local chat / model serving
#
# Fully self-contained: docker/Dockerfile builds its own ROCm+Vulkan
# llama.cpp stage (synced from BackendBuildstage), then adds llama-swap in
# its product-specific tail. No external image dependency.
#
# Assumes: external network `ai-net` exists (scripts/start.sh creates it
# idempotently if not — safe even if BookTranslator was never installed
# on this machine).
#
# Deliberately restart: "no" on every service — started/stopped
# explicitly, not run continuously. See README "Usage pattern".

networks:
  ai-net:
    external: true

services:
  model-server:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: localaichat-model-server:latest
    container_name: localaichat-model-server
    restart: "no"
    # Run as the host user so any file the container writes into the
    # shared models dir (first-run downloads) is owned by you, not root.
    # GPU access is preserved via group_add (video/render) below.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    networks:
      - ai-net
    ports:
      - "11500:11500"   # OpenAI-compatible endpoint (llama-swap multiplexes chat + code)
    volumes:
      # Shared with BookTranslator by convention — a directory mount, not
      # a repo/build dependency. A solo LocalAIChat system just creates it.
      # Override LLM_MODELS_DIR (e.g. /srv/localaichat/llm_models) on a system
      # where models don't live under the invoking user's home.
      - ${LLM_MODELS_DIR:-~/llm_models}:/models
    environment:
      # Backend selection comes from backend.env via scripts/start.sh.
      #   local  - GPU here, serves chat + code (LLAMA_BACKEND picks the binary)
      #   hybrid - CPU fallback only (chat-cpu); GPU models come from the remote
      #   remote - not started at all (this env is defense-in-depth)
      - BACKEND_MODE=${BACKEND_MODE:-local}
      - LLAMA_BACKEND=${LLAMA_BACKEND:-vulkan}
      # RDNA4 (RX 9070 XT, gfx1201) needs this override for ROCm/HIP.
      # Harmless in hybrid (CPU binary ignores it).
      - HSA_OVERRIDE_GFX_VERSION=12.0.1
      - HIP_VISIBLE_DEVICES=0
      - ROCR_VISIBLE_DEVICES=0
      - CHAT_MODEL_PATH=/models/${CHAT_MODEL_FILE:-gpt-oss-20b.gguf}
      - CODE_MODEL_PATH=/models/${CODE_MODEL_FILE:-Qwen2.5-Coder-14B-Instruct-Q5_K_M.gguf}
      # Chat context window. Raised from the entrypoint's 8192 default to
      # give web-search retrieval room (SearXNG snippets get stuffed into
      # the prompt). Re-check VRAM if you push it higher.
      - CHAT_CTX=${CHAT_CTX:-16384}
      # hybrid only: the always-on CPU fallback model + its context size.
      - FALLBACK_MODEL_PATH=/models/${FALLBACK_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}
      - FALLBACK_CTX=${FALLBACK_CTX:-8192}
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      # Numeric GIDs — the group *names* video/render do not resolve
      # inside the container. Match your host: `getent group video render`.
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    shm_size: "2gb"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: localaichat-webui
    restart: "no"
    networks:
      - ai-net
    ports:
      - "3000:8080"
    volumes:
      # Chat history, accounts, uploads, vector DB, embedder cache. Override
      # OWUI_DATA_DIR (e.g. /srv/localaichat/open-webui) for durable storage.
      - ${OWUI_DATA_DIR:-./config/open-webui}:/app/backend/data
    environment:
      # Plural forms — a ";"-separated list of OpenAI-compatible endpoints
      # that Open WebUI queries and merges. scripts/start.sh fills OWUI_*:
      #   local  - one entry: the local llama-swap (chat + code)
      #   remote - one entry: the remote llama-server (chat + code)
      #   hybrid - two: remote GPU system first, then the local CPU fallback.
      #            When the GPU system is off its /models call fails, its
      #            models drop from the dropdown, chat-cpu stays.
      - OPENAI_API_BASE_URLS=${OWUI_OPENAI_BASE_URLS:-http://model-server:11500/v1}
      # Sent as `Authorization: Bearer <key>` per endpoint (paired by index).
      # llama-swap ignores it locally; a remote llama-server checks --api-key.
      - OPENAI_API_KEYS=${OWUI_OPENAI_KEYS:-sk-local}
      # Cap the per-endpoint /models fetch so a powered-off remote stalls the
      # dropdown briefly, not for the full request timeout. (v0.11.0 default
      # is 10s; explicit here because config is env-authoritative.)
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=${OWUI_MODEL_LIST_TIMEOUT:-5}
      - WEBUI_AUTH=${WEBUI_AUTH:-true}
      # Single-user system: first account is admin, keep registration closed.
      # (With ENABLE_PERSISTENT_CONFIG=false the old "signup disabled"
      # value in webui.db is ignored, so it has to be set here.)
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-false}
      # Env is the single source of truth for Open WebUI config: nothing
      # below is read from / written to the `config` table in webui.db, so
      # a fresh system comes up identical and reverting a setting is an env
      # edit + restart. Chat history and accounts are separate tables and
      # still persist. Corollary: web search / RAG / model aliases must be
      # configured here, not in the Admin UI (the UI still shows them, but
      # changes won't stick).
      - ENABLE_PERSISTENT_CONFIG=false
      # Web search. ENABLE_WEB_SEARCH only *offers* the feature — it is
      # opt-in per chat session via the message-bar toggle, never
      # always-on. This is the first thing here that sends data off the
      # system: when a user turns it on, the query text and the fetched pages
      # leave via this container (to the self-hosted SearXNG below, then
      # out to whatever sites it scrapes). No third-party search API.
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-true}
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://localaichat-searxng:8080/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=${WEB_SEARCH_RESULT_COUNT:-3}
      - WEB_SEARCH_CONCURRENT_REQUESTS=${WEB_SEARCH_CONCURRENT_REQUESTS:-10}
      # Local CPU embedder used to rank the fetched snippets before they go
      # in the prompt. Empty engine = built-in sentence-transformers;
      # ~90 MB, pulled into config/open-webui/ on first web search.
      - RAG_EMBEDDING_ENGINE=
      - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
    depends_on:
      - model-server
      - searxng

  searxng:
    # Self-hosted metasearch — no API key, no account. Only the open-webui
    # container talks to it (over ai-net); not published to the host.
    image: searxng/searxng:2026.9.2-05cd77f71
    container_name: localaichat-searxng
    restart: "no"
    networks:
      - ai-net
    volumes:
      - ${SEARXNG_CONF_DIR:-./searxng}:/etc/searxng:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    cap_drop:
      - ALL
    cap_add:
      # uwsgi drops from root to the searxng user at startup.
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
